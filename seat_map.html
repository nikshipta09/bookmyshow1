<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seat Selection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 20px;
      position: relative;
      min-height: 100vh;
    }

    .seat-map-container {
      background: #fff;
      max-width: 900px;
      margin: 20px auto 80px; /* extra space for pay button */
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .showtimes {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .showtimes button {
      padding: 10px 20px;
      background: #eee;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .showtimes button.active {
      background: #ff4668;
      color: white;
    }

    .seat-row {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }

    .seat {
      width: 30px;
      height: 30px;
      margin: 5px;
      text-align: center;
      line-height: 30px;
      border-radius: 4px;
      font-size: 14px;
      border: 1px solid #4CAF50;
      color: #4CAF50;
      cursor: pointer;
      user-select: none;
    }

    .available {
      background: #fff;
    }

    .booked {
      background: #ccc;
      cursor: not-allowed;
      color: white;
    }

    .selected {
      background: #4CAF50;
      color: white;
      border: none;
    }

    /* Pay Button */
    .pay-button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4668;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: none; /* hidden initially */
      z-index: 999;
    }
  </style>
</head>
<body>

<div class="seat-map-container">
  <h2>Select Your Seats</h2>
    <div class="showtimes">
    <button onclick="loadSeats('2:30 PM')" id="btn-230">2:30 PM</button> 
    <button onclick="loadSeats('2:40 PM')" id="btn-240">2:40 PM</button>
    <button onclick="loadSeats('5:30 PM')" id="btn-530">5:30 PM</button>
    <button onclick="loadSeats('8:45 PM')" id="btn-845">8:45 PM</button>
    <button onclick="loadSeats('11:15 PM')" id="btn-1115">11:15 PM</button>
  </div>



  <div id="seat-map">
    <!-- Seats will be loaded here -->
  </div>
</div>

<!-- Pay Button -->
<button id="pay-button" class="pay-button">Pay Rs.0</button>

<script>
document.getElementById("pay-button").addEventListener("click", function() {
    window.location.href = "payment.html"; 
});
</script>


<script>
  const seatData = {
    "2:30 PM": [
      ['available', 'available', 'booked', 'available', 'available'],
      ['booked', 'available', 'available', 'booked', 'available'],
      ['available', 'available', 'available', 'available', 'booked'],
    ],
    "2:40 PM": [
      ['available', 'available', 'booked', 'available', 'booked'],
      ['available', 'booked', 'available', 'available', 'available'],
      ['available', 'available', 'available', 'booked', 'available'],
    ],
    "5:30 PM": [
      ['booked', 'booked', 'available', 'available', 'available'],
      ['available', 'available', 'available', 'booked', 'available'],
      ['available', 'booked', 'booked', 'available', 'available'],
    ],
    "8:45 PM": [
      ['available', 'available', 'available', 'available', 'booked'],
      ['available', 'booked', 'available', 'available', 'available'],
      ['booked', 'available', 'available', 'available', 'booked'],
    ],
    "11:15 PM": [
      ['available', 'available', 'booked', 'available', 'available'],
      ['booked', 'available', 'booked', 'available', 'available'],
      ['available', 'available', 'available', 'booked', 'booked'],
    ],
  };

  const seatPrice = 250; // Rs.250 per seat
  const payButton = document.getElementById('pay-button');

  function loadSeats(showTime) {
    document.querySelectorAll('.showtimes button').forEach(btn => btn.classList.remove('active'));
    
    const btnId = 'btn-' + showTime.replace(':', '').replace(' ', '');
    const activeBtn = document.getElementById(btnId);
    if (activeBtn) activeBtn.classList.add('active');

    const seatMapDiv = document.getElementById('seat-map');
    seatMapDiv.innerHTML = '';

    if (!seatData[showTime]) {
      seatMapDiv.innerHTML = '<p>No seat data available for this time.</p>';
      return;
    }

    seatData[showTime].forEach((row, rowIndex) => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'seat-row';

      row.forEach((seatStatus, seatIndex) => {
        const seat = document.createElement('div');
        seat.className = `seat ${seatStatus}`;
        seat.innerText = seatIndex + 1;
        
        if (seatStatus === 'available') {
          seat.addEventListener('click', () => {
            seat.classList.toggle('selected');
            updatePayButton();
          });
        }

        rowDiv.appendChild(seat);
      });

      seatMapDiv.appendChild(rowDiv);
    });

    updatePayButton(); // Reset pay button
  }

  function updatePayButton() {
    const selectedSeats = document.querySelectorAll('.seat.selected');
    const totalAmount = selectedSeats.length * seatPrice;
    
    if (selectedSeats.length > 0) {
      payButton.style.display = 'block';
      payButton.textContent = `Pay Rs.${totalAmount}`;
    } else {
      payButton.style.display = 'none';
    }
  }

  // Load default 2:30 PM
  loadSeats('2:30 PM');
</script>

</body>
</html>
